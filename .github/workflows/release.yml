name: Release gem

on:
  release:
    types: [published]

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: read    # tag already exists (created by the Release); no push needed
      id-token: write   # OIDC token for Trusted Publishing

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: rubygems/release-gem@v1
